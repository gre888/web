<!DOCTYPE html>
<html>
	<head><title>範例</title></head>
	<body>
    <!-- sup是上標籤 sub是下標標籤 -->
     <!-- small是小型字 -->
        <h2>靜夜思 <span style="vertical-align: super;font-size:60%;">李</span><span style="vertical-align: sub;font-size:60%;">白</span></h2>
		<p>
      <!-- mark是螢光筆效果 -->
       <!-- b strong是粗體 -->
			<span style="font-weight: bold;">床前明月光，</span><span style="background-color: yellow;font-weight: bold;">疑是地上霜。</span><br>
      <!-- s del是刪除線 -->
			<span style="font-style: italic;">舉頭望明月，低頭<span style="text-decoration-line: line-through;">吃便當</span>思故鄉。</span>
		</p>

		<span style="text-decoration-line: underline;">
			月光舖在床前的地上，
			像是一層瑩白的濃霜。
			抬頭眺望窗外的明月，
			低頭思念久別的故鄉。
		</span>
    <br>
    <ruby>漢<rt>ㄏㄢ</rt></ruby>
	</body>
</html>
