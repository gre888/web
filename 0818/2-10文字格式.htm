<!DOCTYPE html>
<html>
	<head><title>範例</title></head>
	<body>
    <!-- sup是上標籤 sub是下標標籤 -->
     <!-- small是小型字 -->
        <h2>靜夜思 <sup><small>李</small></sup><sub>白</sub></h2>
		<p>
			<b>床前明月光，</b><strong><mark>疑是地上霜。</mark></strong><br>
      <!-- s del是刪除線 -->
			<i>舉頭望明月</i>，<em>低頭<s>吃</s><del>便當</del>思故鄉。</em>
		</p>
		<u>
			月光舖在床前的地上，
			像是一層瑩白的濃霜。
			抬頭眺望窗外的明月，
			低頭思念久別的故鄉。
		</u>
	</body>
</html>
