<!DOCTYPE html>
<html lang="zh">
<head>
	<meta charset="UTF-8">
	<title>範例</title>
	<style>
		table{
		  width:300px;
		  border:2px solid black;
      border-spacing: 5px;
		}
    /* 設定表格第一欄的寬度 */
    th:first-child, td:first-child{
      width: 230px;
    }
    /* 設定表格第二欄的寬度 */
    th:nth-child(2), td:nth-child(2){
      width: 70px;
    }




  
		th, td {
		  text-align: center;
      padding:10px;
		  border:1px solid gray;
		}
		td:nth-child(1){
		  text-align:left;
		}
		td:nth-child(2){
		  text-align:right;
		}

    td:only-child{
      background-color: cadetblue;
    }

		/* tr:nth-child(2n+1){
		  background-color: #f1f1f1;
		} */

		tr:nth-child(odd){
		  background-color: #f1f1f1;
		}
    tr:nth-child(even){
      background-color: #e0e0e0;
    }
		tr:first-child{
		  color: #FFFFFF;
		  background-color: #00CED1;
		}

    tr:last-child{
      color: blueviolet;
    }
    tr:nth-last-child(2){
      color: green;
    }
    tr:hover{
      background-color: lightblue;
    }


	</style>
</head>

<body>
	<h2>花生餅乾</h2>
	<table>
	  <tr>
	    <th>食材</th>
	    <th>份量</th>
	  </tr>
	  <tr>
	    <td>無鹽奶油</td>
	    <td>120g</td>
	  </tr>
	  <tr>
	    <td>白細砂糖</td>
	    <td>100g</td>
	  </tr>
	  <tr>
	    <td>全蛋1顆</td>
	    <td>50g</td>
	  </tr>
	  <tr>
	    <td>低筋麵粉</td>
	    <td>250g</td>
	  </tr>
	  <tr>
	    <td>花生醬</td>
	    <td>50g</td>
	  </tr>
	  <tr>
	    <td>泡打粉</td>
	    <td>2g</td>
	  </tr>

    <tr>
	    <td colspan="2">以上結束</td>
	  </tr>


	</table>
</body>
</html>
