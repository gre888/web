<!DOCTYPE html>
<html lang="zh">
<head>
	<meta charset="UTF-8">
	<title>範例</title>
	<style>
    /* 設定第三個p不分種類 */
		p:nth-child(3){
		  background-color: yellow;
		}
    /* 設定第三個p 只算想同標籤 */
		p:nth-of-type(3){
		  background-color: green;
		}
    /* 只算想同種類 */
    h2:nth-of-type(1){
      background-color: orange;
    }
    h2:nth-of-type(2){
      background-color: pink;
    }




	</style>
</head>
<body>
  <div>
    <h2>花生餅乾</h2>
    <p>無鹽奶油 120g</p>
    <p>白細砂糖 100g</p>
    <p>全蛋1顆	50g</p>
    <p>低筋麵粉 250g</p>
    <p>花生醬 50g</p>
    <p>泡打粉 2g</p>
    <h2>草莓餅乾</h2>
    <p>無鹽奶油 120g</p>
    <p>白細砂糖 100g</p>
    <p>全蛋1顆	50g</p>
    <p>低筋麵粉 250g</p>
    <p>草莓醬 50g</p>
    <p>泡打粉 2g</p>
  </div>
</body>
</html>
