<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>有參數有回傳值的函式</title>
    <script>
      function C2F(degreeC) {
        return degreeF = degreeC * 1.8 + 32;			//傳回轉換完畢的結果
      }

    </script>
  </head>
  <body>
    <script>
      let temperature = prompt("請輸入攝氏溫度", "");
      let result = C2F(temperature);					//將傳回值指派給變數result
      alert("攝氏" + temperature + "度可以轉換為華氏" + result + "度");
    </script>
  </body>
</html>
