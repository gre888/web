<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <script>
      //宣告名稱為C2F、參數為degreeC的函式
      function C2F(degreeC) {
        let degreeF = degreeC * 1.8 + 32;
        alert("攝氏" + degreeC + "度可以轉換為華氏" + degreeF + "度");
      }

    </script>
  </head>
  <body>
    <script>
      let temperature = prompt("請輸入攝氏溫度", "");
      C2F(temperature);

    </script>
  </body>
</html>
