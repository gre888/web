<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <style>
      h1 {
        height: 200px;
        text-align: center;
        line-height: 200px;
      }
    </style>
  </head>
  <body> 
    <h1 style="background-image: radial-gradient(circle, yellow, orange);">春曉</h1>
    <h1 style="background-image: radial-gradient(ellipse, yellow, orange);">春曉</h1>
	  <h1 style="background-image: radial-gradient(at right, white, lightgreen);">送別</h1>
    <h1 style="background-image: radial-gradient(at top, white, lightgreen);">送別</h1>
    <h1 style="background-image: radial-gradient(at right top, white, lightgreen);">送別</h1>
    <h1 style="background-image: radial-gradient(circle, white, lightgreen);">春曉(circle)</h1>
    <h1 style="background-image: radial-gradient(closest-side at 70% 30%, white, lightgreen);">送別(closest-side at 70% 30%)</h1>
    <h1 style="background-image: radial-gradient(farthest-side at 70% 30%, white, lightgreen);">送別(farthest-side at 70% 30%)</h1>
    <h1 style="background-image: radial-gradient(closest-corner at 70% 30%, white, lightgreen);">送別(closest-corner at 70% 30%)</h1>
    <h1 style="background-image: radial-gradient(farthest-corner at 70% 30%, white, lightgreen);">送別(farthest-corner at 70% 30%)</h1>
    <h1 style="background-image: radial-gradient(circle, yellow, orange);">春曉</h1>
    <h1 style="background-image: radial-gradient(circle, yellow 0%, orange 50%);">春曉(yellow 0%, orange 50%)</h1>
    <h1 style="background-image: radial-gradient(circle, yellow 0%, orange 100%);">春曉(yellow 0%, orange 100%)</h1>
  </body>
</html>
