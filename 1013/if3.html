<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <script>
      let x = prompt("輸入0 ~ 100的數字", "");
      if (x >= 90)
        alert("優等！");
      else if (x < 90 && x >= 80)
        alert("甲等！");
      else if (x < 80 && x >= 70)
        alert("乙等！");
      else if (x < 70 && x >= 60)
        alert("丙等！");
      else
        alert("不及格！");
    </script>
  </head>
</html>
