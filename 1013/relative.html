<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <style>
      p {line-height: 2;}
      .note {
        font-size:0.7rem; color: blue; 
        position: relative;
        top: 0.5rem; left: 0.5rem;
      }
    </style>
  </head>
  <body>
    <p>庭院深深深幾許？ 楊柳堆煙，簾幕無重數。
       <span class="note">註釋1：堆煙意指楊柳濃密</span>
    </p>
    <p>玉勒雕鞍遊冶處，樓高不見章臺路。
       <span class="note">註釋2：章台路意指歌妓聚居之所</span>
    </p>
    <p>雨橫風狂三月暮，門掩黃昏，無計留春住。</p>
    <p>淚眼問花花不語，亂紅飛過秋千去。
       <span class="note">註釋3：亂紅意指落花</span>
    </p>
  </body>
</html>
