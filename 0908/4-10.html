<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <title>Document</title>
  </head>
  <body>
    <form action="4-10data.php" method="get">
      <p>姓名：<input type="text" name="username" placeholder="請輸入姓名" required autofocus autocomplete="off"></p>
      <p>身分證：<input type="text" name="check0" placeholder="身分證格式" pattern="[A-Z][1-2][0-9]{8}"></p>
      <p>文字：<input type="text" name="check1" placeholder="第一個字為大小寫英文或數字" pattern="[A-Za-z0-9]{1}[\S]*"></p>
      <p>文字：<input type="text" name="check2" placeholder="前三個字為大小寫英文或數字" pattern="[A-Za-z0-9]{3}[\S]*"></p>
      <p>文字：<input type="text" name="check3" placeholder="必須為大小寫英文或數字" pattern="[A-Za-z0-9]+"></p>  
      <p>搜尋：<input type="search" name="search"></p>
      <p>信箱1:<input type="email" name="email"></p>
      <p>信箱2:<input type="text" name="email2" pattern="[a-zA-Z0-9\._%\+\-]+@[a-zA-Z0-9\.\-]+\.[a-z]{2,4}$">
      <p>網址：<input type="text" name="url" pattern="^(https?:\/\/)?([\da-z\.-]+)\.([a-z\.]{2,6})([\/\w \.-]*)*\/?$"></p>
      <p>電話：<input type="tel" name="tel"></p>
      <p>數字：<input type="number" name="number" min="1" max="21" step="3"></p>
      <p>日期：<input type="date" name="date"></p>
      <p>時間：<input type="time" name="time"></p>
      <p>程度：<input type="range" name="range" min="0" max="1000" step="1" value="0"></p>
      <p>顏色：<input type="color" name="color"></p>
      

      <p><input type="submit" value="送出">
      <input type="reset" value="重置"></p>
    </form>
