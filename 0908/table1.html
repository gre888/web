<!DOCTYPE html>
<html lang="zh">
  <head>
    <meta charset="utf-8">
    <title>角色介紹</title>
    <style>
      table {
        border:5px solid #000;
        background-color: antiquewhite;
        width: 70%;
        margin:10px auto; /* 上下10px 左右置中 */
      }
      tr:hover {
        background-color: #f5f5f5;
      }
      th, td {
        border: 3px solid #ddd;

      }
    </style>
  </head>
  <body>
	  <table >
      <tr>
        <th>角色</th>
        <th>人物描述</th>
      </tr>
      <tr>
        <td>芙莉蓮</td>
        <td>精靈魔法使，與夥伴擊敗魔王後，獨自踏上探索情感的旅程。</td>
      </tr>
      <tr>
        <td>欣梅爾</td>
        <td>溫柔的勇者，他是芙莉蓮漫長旅途中重要且思念的夥伴。</td>
      </tr>
    </table>
  </body>
</html>
