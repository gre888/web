<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        @font-face {
            font-family: '清松手寫體';
            src: url('fonts/JasonHandwriting.ttf');
        }
        @font-face {
            font-family: '隨峰體';
            src: url('fonts/ThePeakFontBeta.ttf');
        }
        @font-face {
            font-family: '內海體';
            src: url('fonts/NaikaiFont-ExtraLight.ttf');
            font-weight: 100;
        }
        @font-face {
            font-family: '內海體';
            src: url('fonts/NaikaiFont-Light.ttf');
            font-weight: 300;
        }
        @font-face {
            font-family: '內海體';
            src: url('fonts/NaikaiFont-Regular-Lite.ttf');
            font-weight: 400;
        }
        @font-face {
            font-family: '內海體';
            src: url('fonts/NaikaiFont-Regular.ttf');
            font-weight: 500;
        }
        @font-face {
            font-family: '內海體';
            src: url('fonts/NaikaiFont-SemiBold.ttf');
            font-weight: 600;
        }
        @font-face {
            font-family: '內海體';
            src: url('fonts/NaikaiFont-Bold.ttf');
            font-weight: 800;
        }
    </style>
</head>
<body>
    <div style="font-family: '清松手寫體'; font-weight: bold;">清松手寫體</div>
    <div style="font-family: '隨峰體'; font-weight: bold;">隨峰體</div>
    <div style="font-family: '內海體'; font-weight: 100;">內海體 100</div>
    <div style="font-family: '內海體'; font-weight: 300;">內海體 300</div>
    <div style="font-family: '內海體'; font-weight: 400;">內海體 400</div>
    <div style="font-family: '內海體'; font-weight: 500;">內海體 500</div>
    <div style="font-family: '內海體'; font-weight: 600;">內海體 600</div>
    <div style="font-family: '內海體'; font-weight: 800;">內海體 800</div>
</body>
</html>
