<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
  </head>
  <body>    
    <h1 style="color: blue;">蝶戀花 blue</h1>
    <h1 style="color: rgb(0, 0, 255);">蝶戀花 rgb(0, 0, 255)</h1>
    <h1 style="color: rgb(0%, 0%, 100%);">蝶戀花 rgb(0%, 0%, 100%)</h1>
    <h1 style="color: rgba(0, 0, 255, 0.3);">蝶戀花rgba(0, 0, 255, 0.3)</h1>
    <h1 style="color: #0000ff;">蝶戀花 #0000ff</h1>
    <h1 style="color: #00f;">蝶戀花 #00f</h1>
    <!-- 
    H	Hue (色相)	色彩的基本相貌（即色環上的位置）。	0 到 360（代表度數 deg，通常可省略單位）。
      色相是以 360 度的色環來表示的，常見的顏色對應角度為：
                 0deg / 360deg：紅色 (Red)
                 60deg：黃色 (Yellow)
                 120deg：綠色 (Green)
                 180deg：青色 (Cyan)
                 240deg：藍色 (Blue)
                 300deg：洋紅 / 品紅 (Magenta)
    S	Saturation (飽和度)	色彩的純度或鮮豔程度。值越高越鮮豔，0% 呈現灰色。	0% 到 100%。
    L	Lightness (亮度)	色彩的明暗程度。0% 為全黑，100% 為全白，50% 為標準色。	0% 到 100%。
    -->
    <h1 style="color: hsl(240, 100%, 50%);">蝶戀花 hsl(240, 100%, 50%)</h1>
    <h1 style="color: hsla(240, 100%, 50%, 0.3);">蝶戀花 hsla(240, 100%, 50%, 0.3)</h1> 
  </body>
</html>
