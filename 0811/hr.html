<!DOCTYPE html> 
<html>
  <head>
    <meta charset="utf-8">
  </head>
  <body>
    <p style="font-size:20px;margin-bottom:0px;color:blue;">春曉</p>
    <hr style="width: 34px;float:left;margin-top:0px;border-color:green;border-width:3px;">
	  <p style="clear: both;">春眠不覺曉，處處聞啼鳥；夜來風雨聲，花落知多少？</p>
	  <hr>
    <p style="text-decoration-line: underline;color:salmon;text-underline-offset:5px;text-decoration-color:red;text-decoration-thickness:3px;">送別</p>
	  <p>山中相送罷，日暮掩柴扉。春草明年綠，王孫歸不歸。</p>
	  <hr>
    <p>相思</p>
	  <p>紅豆生南國，春來發幾枝？願君多采擷，此物最相思。</p>
    <hr style="height: 5px;background-color: blue; border: 5px solid darkred;">
  </body>
</html>
