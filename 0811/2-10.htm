<!DOCTYPE html>
<html>
	<head><title>文字格式</title></head>
	<body>
    <!-- sup 上標字 sub是下標字 -->
        <h2>靜夜思 <sup style="font-size: 60%;">李</sup><sub style="font-size: 60%;">白</sub></h2>
		<p>
      <!-- b and strong是粗體字 -->
			<b>床前明月光，</b><strong>疑是地上霜。</strong><br>
      <!-- i and em是斜體字 -->
			<i>舉頭望明月</i>，<em>低頭思故鄉。</em>
		</p>
    <!-- u ins都是自底線 -->
		<u>
			月光舖在床前的地上，
			像是一層瑩白的濃霜。
    </u>
    <ins>
			抬頭眺望窗外的明月，
			低頭思念久別的故鄉。
    </ins>    
		
	</body>
</html>
