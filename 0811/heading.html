<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <style>
      p,h1 {color: aquamarine;background-color: rgb(140, 0, 255);}
    </style>
  </head>
  <body>
    第一行<br><br>第二行 
    <!--
    段落標籤特性
    1. 會在標籤的前後自動換行,而且結束的換行跟開始的換行會合併成一個換行
    2. 會自動在段落上下加上margin  
    3. 上下間距重疊且以較大的margin顯示
    4. 寬度預設100% 高度預設auto
    -->
    <p>標題margin</p>
    <h1>標題1</h1>
    <h2>標題2</h2>
    <h3>標題3</h3>
    <h4>標題4</h4>
    <h5>標題5</h5>
    <h6>標題6</h6>
  </body>
</html>
