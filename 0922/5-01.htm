<!DOCTYPE html>
<html>

	<head>
		<title>範例</title>
		<style>
			h1 {
				color: blue;
			}
			/* % = 相對於父元素的字體大小 */
			/* rem = 相對於根元素(html)的字體大小 */
			#maindiv {
				font-size: 75%;
			}
			.poem {
				/* font-style: italic; */
				font-size: 120%;
			}
			#direct120 {
				font-size: 1.2rem;
			}
		</style>
	</head>

	<body>
		<h1>靜夜思  李白</h1>
		標準字體(100%)
		<div style="font-size: 120%;">字體(120%)</div>
		<div style="font-size: 90%;">床前字體(90%)</div>
		<div id="maindiv">
			床前字體(75%)
			<p class="poem">
			床前明月光，疑是地上霜。(75%*120%=90%)<br>
			舉頭望明月，低頭思故鄉。
			</p>
			
			<p class="poem">
			月光舖在床前的地上，(75%*120%=90%)<br>
			像是一層瑩白的濃霜。<br> 
			抬頭眺望窗外的明月，<br> 
			低頭思念久別的故鄉。
			</p>
			<p>
			月光舖在床前的地上，(75%)<br>
			像是一層瑩白的濃霜。<br> 
			抬頭眺望窗外的明月，<br> 
			低頭思念久別的故鄉。
			</p>
			<p id="direct120">
			月光舖在床前的地上，(1.2rem=120%)<br>
			像是一層瑩白的濃霜。<br> 
			抬頭眺望窗外的明月，<br> 
			低頭思念久別的故鄉。
			</p>
		</div>
	</body>

</html>
